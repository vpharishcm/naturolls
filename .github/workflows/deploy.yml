# Every push to main is tested, and goes live only if every test passes.
# Pull requests and other branches are tested but never deployed.
# Setup: docs/AUTOMATED_DEPLOY.md
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # The same database family and version as the live server.
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: naturolls_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # GitHub's machines have MySQL's tools, not MariaDB's, so backups are tested the PHP way.
      BACKUP_DRIVER: php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install server libraries
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Backend tests
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

  deploy:
    needs: test
    # Runs only for main, and only once the server details are saved in the repository settings.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.APP_DIR != ''
    runs-on: ubuntu-latest
    environment: production
    # Two deploys never overlap; a newer push waits for the one in progress.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_DIR: ${{ vars.APP_DIR }}
      WEB_DIR: ${{ vars.WEB_DIR }}
      SITE_URL: ${{ vars.SITE_URL }}
      PHP_BIN: ${{ vars.PHP_BIN || '/usr/local/bin/php' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble the files to upload
        run: |
          mkdir -p out/app out/web
          rsync -a backend/ out/app/ \
            --exclude vendor --exclude node_modules --exclude tests --exclude public \
            --exclude .env --exclude storage --exclude phpunit.xml --exclude .phpunit.result.cache
          (cd out/app && composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist)
          printf 'Require all denied\n' > out/app/.htaccess
          cp -r frontend/dist/. out/web/
          cp deploy/hosting/public_html/index.php deploy/hosting/public_html/.htaccess out/web/

      - name: Connect to the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host server"
            echo "  HostName ${{ secrets.SSH_HOST }}"
            echo "  Port ${{ secrets.SSH_PORT }}"
            echo "  User ${{ secrets.SSH_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
          ssh server "echo connected to \$(hostname)"

      - name: Take a backup, then pause the app
        # A failed backup stops the deploy, so nothing changes without a fresh backup.
        run: ssh server "cd '$APP_DIR' && $PHP_BIN artisan backup:run && $PHP_BIN artisan down --retry=15"

      # The server has no rsync, so files go up as one tar file, then replace the old ones in a single step.
      - name: Upload the server code
        # .env and storage (logs, backups, photos, sessions) stay as they are on the server.
        run: |
          tar -czf - -C out/app . | ssh server "cat > ~/.naturolls_app_upload.tgz"
          ssh server "cd '$APP_DIR' && test -f .env && \
            find . -mindepth 1 -maxdepth 1 ! -name .env ! -name storage -exec rm -rf {} + && \
            tar -xzf ~/.naturolls_app_upload.tgz && rm -f ~/.naturolls_app_upload.tgz"

      - name: Update the database and clear caches
        run: ssh server "cd '$APP_DIR' && $PHP_BIN artisan migrate --force && $PHP_BIN artisan optimize:clear"

      - name: Upload the app
        run: |
          # cPanel keeps the website's PHP version inside .htaccess; keep that part of the live file.
          ssh server "sed -n '/# php -- BEGIN cPanel-generated handler/,/# php -- END cPanel-generated handler/p' '$WEB_DIR/.htaccess' 2>/dev/null" > handler.txt || true
          if [ -s handler.txt ]; then cat handler.txt out/web/.htaccess > merged && mv merged out/web/.htaccess; fi
          tar -czf - -C out/web . | ssh server "cat > ~/.naturolls_web_upload.tgz"
          # Files cPanel manages in the web folder are kept.
          ssh server "cd '$WEB_DIR' && test -f index.php && \
            find . -mindepth 1 -maxdepth 1 ! -name .well-known ! -name cgi-bin ! -name error_log ! -name .user.ini ! -name php.ini -exec rm -rf {} + && \
            tar -xzf ~/.naturolls_web_upload.tgz && rm -f ~/.naturolls_web_upload.tgz"

      - name: Resume the app
        if: always()
        run: ssh server "cd '$APP_DIR' && $PHP_BIN artisan up" || true

      - name: Check the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
          api=$(curl -s -H 'Accept: application/json' "$SITE_URL/api/v1/auth/me")
          echo "site: $code  api: $api"
          [ "$code" = "200" ] && echo "$api" | grep -q unauthenticated
